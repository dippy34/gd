name: Validate GD handoff
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect artifacts and validate factory invariants
        run: python tools/validate_repo.py
      - name: Test safe copy and inspection tooling
        run: python -m unittest discover -s tests -v
